[project]
name = "clot-contraction-monitor"
version = "0.1.0"
description = "Clot Contraction Monitor - Analyze clot contraction patterns in biological experiments"
authors = [
    {name = "Aleksandr Sinitca",email = "siniza.s.94@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.5.0",
    "pillow>=8.0.0",
    "scikit-image>=0.18.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "onnxruntime==1.22.0",
    "onnxruntime-directml==1.22.0",
    "openvino==2025.1.0",
    "typing_extensions>=4.0.0"
]

[tool.poetry]
packages = [{include = "clot_contraction_monitor", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
