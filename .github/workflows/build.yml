name: Build

on:
  pull_request:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            binary: clot-contraction-monitor.exe
          - os: ubuntu-latest
            artifact: linux-x64
            binary: clot-contraction-monitor
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # REQUIRED: *.onnx are LFS objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: clot-contraction-monitor-app/pyproject.toml

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        working-directory: clot-contraction-monitor-app
        run: |
          pip install .
          pip install pyinstaller

      - name: Check LFS assets are real files
        run: |
          for f in clot-contraction-monitor-app/src/clot_contraction_monitor/assets/*.onnx; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            test "$size" -gt 1000000
          done

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/clot-contraction-monitor-app/src
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/run_tests.py
          else
            python tests/run_tests.py
          fi

      - name: Build with PyInstaller
        working-directory: clot-contraction-monitor-app
        run: pyinstaller --clean --noconfirm clot-contraction-monitor.exe.spec

      - name: Smoke test binary
        working-directory: clot-contraction-monitor-app/dist
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./${{ matrix.binary }} --help
          else
            ./${{ matrix.binary }} --help
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clot-contraction-monitor-${{ matrix.artifact }}
          path: clot-contraction-monitor-app/dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"   # release/1.2.3 -> release-1.2.3 (no '/' in filenames)
          mkdir out
          cp "artifacts/clot-contraction-monitor-windows-x64/clot-contraction-monitor.exe" \
             "out/clot-contraction-monitor-${TAG}-windows-x64.exe"
          cp "artifacts/clot-contraction-monitor-linux-x64/clot-contraction-monitor" \
             "out/clot-contraction-monitor-${TAG}-linux-x64"
          chmod +x "out/clot-contraction-monitor-${TAG}-linux-x64"
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
